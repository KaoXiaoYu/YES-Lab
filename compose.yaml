name: openlims

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --performance-schema=OFF
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: openlims
      MYSQL_USER: ${OPENLIMS_DATABASE_USERNAME}
      MYSQL_PASSWORD: ${OPENLIMS_DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${OPENLIMS_MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ${OPENLIMS_DATA_ROOT:-/srv/openlims/data}/mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 320m
    logging: *default-logging
    networks: [backend]

  api:
    image: ${OPENLIMS_API_IMAGE:-ghcr.io/yeslab-uavtech/openlims-api}:${OPENLIMS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OPENLIMS_DATABASE_URL: jdbc:mysql://mysql:3306/openlims?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      OPENLIMS_DATABASE_USERNAME: ${OPENLIMS_DATABASE_USERNAME}
      OPENLIMS_DATABASE_PASSWORD: ${OPENLIMS_DATABASE_PASSWORD}
      OPENLIMS_DATABASE_MAX_POOL_SIZE: 8
      OPENLIMS_DATABASE_MIN_IDLE: 1
      OPENLIMS_JWT_SECRET: ${OPENLIMS_JWT_SECRET}
      OPENLIMS_JWT_ISSUER: ${OPENLIMS_JWT_ISSUER:-openlims-api}
      OPENLIMS_CORS_ALLOWED_ORIGINS: ${OPENLIMS_CORS_ALLOWED_ORIGINS}
      OPENLIMS_INITIAL_ADMIN_ENABLED: ${OPENLIMS_INITIAL_ADMIN_ENABLED:-false}
      OPENLIMS_INITIAL_ADMIN_USERNAME: ${OPENLIMS_INITIAL_ADMIN_USERNAME:-admin}
      OPENLIMS_INITIAL_ADMIN_PASSWORD: ${OPENLIMS_INITIAL_ADMIN_PASSWORD:-}
      OPENLIMS_INITIAL_ADMIN_DISPLAY_NAME: ${OPENLIMS_INITIAL_ADMIN_DISPLAY_NAME:-系统管理员}
      OPENLIMS_INITIAL_ADMIN_MEMBER_CODE: ${OPENLIMS_INITIAL_ADMIN_MEMBER_CODE:-T-001}
      OPENLIMS_ACHIEVEMENTS_DIRECTORY: /var/lib/openlims/uploads/achievements
      OPENLIMS_PROJECTS_DIRECTORY: /var/lib/openlims/uploads/projects
      OPENLIMS_MEMBERS_DIRECTORY: /var/lib/openlims/uploads/members
      OPENLIMS_RECRUITMENT_DIRECTORY: /var/lib/openlims/uploads/recruitment
      OPENLIMS_HOMEPAGE_MODELS_DIRECTORY: /var/lib/openlims/uploads/homepage-models
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -Xss512k -XX:+UseSerialGC
      TZ: Asia/Shanghai
    volumes:
      - ${OPENLIMS_DATA_ROOT:-/srv/openlims/data}/uploads:/var/lib/openlims/uploads
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    mem_limit: 384m
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  web:
    image: ${OPENLIMS_WEB_IMAGE:-ghcr.io/yeslab-uavtech/openlims-web}:${OPENLIMS_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      OPENLIMS_SITE_ADDRESS: ${OPENLIMS_SITE_ADDRESS}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks: [backend]

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:
