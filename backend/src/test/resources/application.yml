spring:
  datasource:
    url: jdbc:h2:mem:openlims-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

openlims:
  task:
    settlement:
      # 测试环境关闭到期结算调度：调度线程使用独立事务并会提交，而测试依赖逐用例回滚做绝对断言
      # （PointApiTests 就依赖这一点）。测试改为直接调用 TaskSettlementService.settle(...)。
      enabled: false
  storage:
    sponsors-directory: ./target/test-sponsors
    homepage-models-directory: ./target/test-homepage-models
    achievements-directory: ./target/test-achievements
    projects-directory: ./target/test-projects
    members-directory: ./target/test-members
  cors:
    allowed-origins: http://localhost:5173
  security:
    jwt:
      issuer: openlims-api-test
      secret: openlims-test-secret-key-with-at-least-thirty-two-bytes
      ttl: PT30M
    refresh-token:
      session-ttl: PT12H
      remembered-ttl: P30D
      secure-cookie: false
    bootstrap:
      enabled: true
      teacher-password: OpenLIMS-Teacher-2026!
      core-password: OpenLIMS-Core-2026!
      member-password: OpenLIMS-Member-2026!
