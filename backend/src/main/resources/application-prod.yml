spring:
  datasource:
    url: ${OPENLIMS_DATABASE_URL}
    username: ${OPENLIMS_DATABASE_USERNAME}
    password: ${OPENLIMS_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${OPENLIMS_DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${OPENLIMS_DATABASE_MIN_IDLE:2}
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

openlims:
  storage:
    sponsors-directory: ${OPENLIMS_SPONSORS_DIRECTORY:/var/lib/openlims/uploads/sponsors}
    homepage-models-directory: ${OPENLIMS_HOMEPAGE_MODELS_DIRECTORY:/var/lib/openlims/uploads/homepage-models}
    achievements-directory: ${OPENLIMS_ACHIEVEMENTS_DIRECTORY:/var/lib/openlims/uploads/achievements}
    projects-directory: ${OPENLIMS_PROJECTS_DIRECTORY:/var/lib/openlims/uploads/projects}
    members-directory: ${OPENLIMS_MEMBERS_DIRECTORY:/var/lib/openlims/uploads/members}
    recruitment-directory: ${OPENLIMS_RECRUITMENT_DIRECTORY:/var/lib/openlims/uploads/recruitment}
  cors:
    allowed-origins: ${OPENLIMS_CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      issuer: ${OPENLIMS_JWT_ISSUER:openlims-api}
      secret: ${OPENLIMS_JWT_SECRET}
      ttl: PT15M
    refresh-token:
      session-ttl: PT12H
      remembered-ttl: P30D
      secure-cookie: true
    bootstrap:
      enabled: false
    initial-admin:
      enabled: ${OPENLIMS_INITIAL_ADMIN_ENABLED:false}
      username: ${OPENLIMS_INITIAL_ADMIN_USERNAME:admin}
      password: ${OPENLIMS_INITIAL_ADMIN_PASSWORD:}
      display-name: ${OPENLIMS_INITIAL_ADMIN_DISPLAY_NAME:系统管理员}
      member-code: ${OPENLIMS_INITIAL_ADMIN_MEMBER_CODE:T-001}
