spring:
  application:
    name: yes-lab-api

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

yeslab:
  cors:
    allowed-origins: ${YESLAB_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://yes-lab-public.funskii55.chatgpt.site}

