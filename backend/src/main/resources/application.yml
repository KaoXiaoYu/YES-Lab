spring:
  application:
    name: yes-lab-api
  datasource:
    url: ${YESLAB_DATABASE_URL:jdbc:h2:file:./data/yeslab;AUTO_SERVER=TRUE}
    username: ${YESLAB_DATABASE_USERNAME:sa}
    password: ${YESLAB_DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 80MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

yeslab:
  storage:
    achievements-directory: ${YESLAB_ACHIEVEMENTS_DIRECTORY:./data/achievements}
    projects-directory: ${YESLAB_PROJECTS_DIRECTORY:./data/projects}
  cors:
    allowed-origins: ${YESLAB_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://yes-lab-public.funskii55.chatgpt.site}
  security:
    jwt:
      issuer: yes-lab-api
      secret: ${YESLAB_JWT_SECRET:local-development-only-change-this-yes-lab-secret-2026}
      ttl: PT15M
    refresh-token:
      session-ttl: PT12H
      remembered-ttl: P30D
      secure-cookie: ${YESLAB_SECURE_COOKIE:false}
    bootstrap:
      enabled: ${YESLAB_BOOTSTRAP_ENABLED:true}
      teacher-password: ${YESLAB_BOOTSTRAP_TEACHER_PASSWORD:YesLab-Teacher-2026!}
      core-password: ${YESLAB_BOOTSTRAP_CORE_PASSWORD:YesLab-Core-2026!}
      member-password: ${YESLAB_BOOTSTRAP_MEMBER_PASSWORD:YesLab-Member-2026!}
    initial-admin:
      enabled: ${YESLAB_INITIAL_ADMIN_ENABLED:false}
      username: ${YESLAB_INITIAL_ADMIN_USERNAME:admin}
      password: ${YESLAB_INITIAL_ADMIN_PASSWORD:}
      display-name: ${YESLAB_INITIAL_ADMIN_DISPLAY_NAME:系统管理员}
      member-code: ${YESLAB_INITIAL_ADMIN_MEMBER_CODE:T-001}
